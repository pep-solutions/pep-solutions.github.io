<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Confronto logo — PEP Solutions</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .cmp { display: grid; gap: 20px; }
    @media (min-width: 760px) { .cmp { grid-template-columns: repeat(2, 1fr); } }
    .cmp figure { margin: 0; background: #fff; border-radius: 16px; padding: 20px; text-align: center; }
    .cmp img { height: 320px; max-width: 100%; object-fit: contain; }
    .cmp figcaption { margin-top: 10px; font-family: var(--titoli); font-weight: 700; }
    .cmp small { display: block; font-family: var(--testo); font-weight: 400; color: var(--ardesia); }
  </style>
</head>
<body>
  <section>
    <p class="kicker">Pagina temporanea di confronto</p>
    <h2>Logo: originale e nuova versione</h2>
    <div class="cmp">
      <figure><img src="originale-pdf.png" alt="Originale dal PDF"><figcaption>0 · Originale<small>la bozza scelta nel PDF</small></figcaption></figure>
      <figure><img src="simbolo-nuovo.svg" alt="Nuovo"><figcaption>C · Nuovo<small>vettorializzato dall'originale, con il ricciolo a nodo</small></figcaption></figure>
    </div>
  </section>
</body>
</html>
